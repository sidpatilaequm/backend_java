spring.application.name=file-upload-api
spring.datasource.url=jdbc:mysql://localhost:3306/multimedia_governance?createDatabaseIfNotExist=true
#spring.datasource.url=jdbc:mysql://localhost:3306/multimedia_governance_demo?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
 spring.datasource.password=${DB_PASSWORD:tiger}
#spring.datasource.password=GstCheck   2025
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
server.port=8080
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
attestr.auth.token=${ATTESTR_AUTH_TOKEN:}
#google.api.key=AIzaSyDgvcsoFQrh7Pg1tOAaQiS4AGFUc74x9qw

use.mock.responses= true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# RapidAPI Configuration for GST Insights
rapidapi.key=${RAPIDAPI_KEY:}
rapidapi.host=gst-insights-api.p.rapidapi.com

# Business Card Scanner API Configuration
business.card.scanner.api.key=${RAPIDAPI_KEY:}
business.card.scanner.api.host=business-card-scanner.p.rapidapi.com
business.card.scanner.api.url=https://business-card-scanner.p.rapidapi.com/processDocument

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin

# Become a Supplier — document OCR + KYC verification + WorkFlow submission
# openai.api.key is no longer read directly by Java — OCR now delegates to Image_Describer's
# /supplier-doc/extract endpoint, which reads OPENAI_API_KEY from its own environment.
openai.api.key=${OPENAI_API_KEY:}
image.describer.base-url=${IMAGE_DESCRIBER_BASE_URL:http://localhost:5000}
microvista.token.id=${MICROVISTA_TOKEN_ID:}
microvista.token.secret=${MICROVISTA_TOKEN_SECRET:}
microvista.api.version=1
workflow.api.base-url=${WORKFLOW_API_BASE_URL:http://localhost:8001}
workflow.vendor-approval.id=8
workflow.vendor-change-request.id=13
workflow.webhook.secret=${WORKFLOW_WEBHOOK_SECRET:}
# Shared secret sent as the X-Service-Token header when calling
# POST /api/email-templates/trigger/{mail_key} on WorkFlow. Must match
# WorkFlow's own JAVA_SERVICE_TOKEN env var.
workflow.email-templates.service-token=${WORKFLOW_EMAIL_SERVICE_TOKEN:secret-java-workflow-token-123}

# Questionnaire builder (dynamic_questions/Form Studio) — admin-CRUD backend only, forwarded to
# via QuestionnaireProxyController; the seller-facing read/write path never calls this directly
# (see QuestionnaireService, which reads/writes the same shared-DB tables via JPA instead). Local
# dev default is 8010, not 8000, since WorkFlow already defaults to 8000 locally.
form.studio.base-url=${FORM_STUDIO_BASE_URL:http://localhost:8010}
questionnaire.external-key.supplier-registration=become_a_supplier